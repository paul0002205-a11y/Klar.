name: Klar Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK to GitHub repository
        if: success()
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/Klar-v0.2-debug.apk
          echo "Built on $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}" > builds/Klar-v0.2-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/Klar-v0.2-debug.apk builds/Klar-v0.2-build.txt
          git commit -m "build: publish Android debug APK [skip ci]"
          git push origin HEAD:main
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Klar-v0.2-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
