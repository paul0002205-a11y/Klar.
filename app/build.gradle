plugins { id 'com.android.application' }

android {
    namespace 'dev.p1aulie.klar'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.p1aulie.klar'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('stageWebAssets', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'styles.css', 'app.js', 'manifest.webmanifest', 'sw.js', 'icon.svg', 'icon-192.png', 'icon-512.png'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn(tasks.named('stageWebAssets'))
}
