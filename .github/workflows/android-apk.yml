name: Klar Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log
      - name: Publish build and status
        if: always()
        run: |
          mkdir -p builds
          if [ -f gradle-build.log ]; then tail -n 100 gradle-build.log > builds/latest-build.log; fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk builds/Klar-v0.2-debug.apk
            echo "success" > builds/build-status.txt
          else
            echo "failed" > builds/build-status.txt
          fi
          echo "Commit: ${GITHUB_SHA}" >> builds/build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds
          git commit -m "build: record Android APK result [skip ci]"
          git push origin HEAD:main
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Klar-v0.2-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
