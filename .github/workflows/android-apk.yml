name: Klar Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: klar-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log
      - name: Publish build and status
        if: always()
        run: |
          mkdir -p builds
          if [ -f gradle-build.log ]; then tail -n 100 gradle-build.log > builds/latest-build.log; fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk builds/Klar-v0.3-debug.apk
            echo "success" > builds/build-status.txt
          else
            echo "failed" > builds/build-status.txt
          fi
          echo "Commit: ${GITHUB_SHA}" >> builds/build-status.txt
          echo "Run-ID: ${GITHUB_RUN_ID}" >> builds/build-status.txt
          echo "Run-URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> builds/build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds
          git commit -m "build: record Android APK result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Klar-v0.3-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
